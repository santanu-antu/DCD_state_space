logger:
  use_wandb: False
  entity: xingzhis
  project: "patient_trajectory"
  tags: ['default']
model:
  task: classification
  type: ODERNN
  rnn_type: GRU
  targetidx: 1
  output_dim: 4

training:
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  seed: 42
  test_size: 0.2

validation:
  mode: train_only

calibration:
  enabled: false
  pct: 0.2
  epochs: 20
  lr: 0.01
  n_bins_ece: 5

paths:
  root: .
  dataset: data/dataset/yale_bf21.pt
  fold_idx: null
  result: results_local
